<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <!-- Filter Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-rect { fill: url(#bgGrad); }
      .grid-layer { fill: url(#techGrid); }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
        fill: url(#textGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 21px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .card-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #64748b;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .card-value {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #f8fafc;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" class="bg-rect" />
  <rect width="1200" height="420" rx="16" class="grid-layer" />

  <!-- Dynamic / Animated Ambient Glowing Orbs (in background) -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad1)">
    <animate attributeName="cx" values="180;240;180" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="90;130;90" dur="10s" repeatCount="indefinite" />
  </circle>

  <circle cx="1020" cy="300" r="220" fill="url(#glowGrad2)">
    <animate attributeName="cx" values="1020;960;1020" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="300;260;300" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Background Floating Decorative Nodes / Flow Lines (Behind text) -->
  <g opacity="0.45">
    <path d="M 120 330 Q 350 370 600 320 T 1080 340" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;48" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 100 80 Q 400 40 700 90 T 1100 60" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,6">
      <animate attributeName="stroke-dashoffset" values="48;0" dur="5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Subtle Chart Bars Dynamic Graphic in Lower Corner -->
  <g transform="translate(980, 260)" opacity="0.6">
    <rect x="0" y="40" width="14" height="60" rx="4" fill="#38bdf8">
      <animate attributeName="height" values="60;85;50;60" dur="6s" repeatCount="indefinite" />
      <animate attributeName="y" values="40;15;50;40" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="25" width="14" height="75" rx="4" fill="#6366f1">
      <animate attributeName="height" values="75;55;95;75" dur="7s" repeatCount="indefinite" />
      <animate attributeName="y" values="25;45;5;25" dur="7s" repeatCount="indefinite" />
    </rect>
    <rect x="44" y="10" width="14" height="90" rx="4" fill="#a855f7">
      <animate attributeName="height" values="90;105;70;90" dur="5s" repeatCount="indefinite" />
      <animate attributeName="y" values="10;-5;30;10" dur="5s" repeatCount="indefinite" />
    </rect>
    <rect x="66" y="35" width="14" height="65" rx="4" fill="#ec4899">
      <animate attributeName="height" values="65;80;60;65" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="35;20;40;35" dur="6.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Center Floating Tech Badge / Pill -->
  <g transform="translate(80, 52)">
    <rect width="270" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="tagline-text">Curated Ecosystem • 2026</text>
  </g>

  <!-- Main Foreground Content (High Contrast, Never Obscured) -->
  <g transform="translate(80, 140)">
    <!-- Title -->
    <text x="0" y="0" class="title-text">Awesome Data Science Presentation</text>
    <text x="0" y="48" class="title-text">&amp; Notebook Visualization</text>

    <!-- Subtitle -->
    <text x="0" y="96" class="subtitle-text">Interactive Data Apps • Reactive Python Notebooks • BI as Code • Publishing</text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 134)">
      <!-- Pill 1 -->
      <g>
        <rect width="130" height="38" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="18" y="24" class="pill-text">⚡ Reactive UI</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="150" height="38" rx="10" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="18" y="24" class="pill-text">📊 Web Dashboards</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(304, 0)">
        <rect width="145" height="38" rx="10" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="18" y="24" class="pill-text">📑 Report Quarto</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(461, 0)">
        <rect width="138" height="38" rx="10" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="18" y="24" class="pill-text">🔬 Reproducible</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(611, 0)">
        <rect width="142" height="38" rx="10" fill="#1e293b" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="18" y="24" class="pill-text">🚀 SaaS &amp; OSS</text>
      </g>
    </g>
  </g>
</svg>
